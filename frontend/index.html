<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Placas</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .payload {
            font-size: 1.2rem;
            color: black;
            text-align: left;
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            max-width: 800px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .status {
            font-size: 1rem;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }

        .btn-disconnect {
            background-color: #dc3545;
            color: white;
        }

        .btn-disconnect:hover {
            background-color: #c82333;
        }

        .btn-connect {
            background-color: #28a745;
            color: white;
        }

        .btn-connect:hover {
            background-color: #218838;
        }

        .btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="status" class="status">Conectando...</div>
    
    <div class="controls">
        <button id="btn-disconnect" class="btn btn-disconnect"> Desconectar</button>
        <button id="btn-connect" class="btn btn-connect" disabled> Reconectar</button>
    </div>
    
    <div id="payload-display" class="payload">Esperando datos del realtime...</div>

    <script src="app_simple.js"></script>
</body>
</html>
